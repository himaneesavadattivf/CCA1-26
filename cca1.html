<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Second Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph with text formatting -->
    <p>This is a sample paragraph demonstrating basic <strong>bold text</strong> and <em>italicized text</em>.</p>

    <!-- Hyperlink to an external site -->
    <p>Learn more web development tips on <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.</p>

    <!-- Unordered List -->
    <h2>My Favorite Fruits</h2>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
        <li>Pineapple</li>
        <li>Mango</li>
    </ul>

    <!-- Image tag (requires a valid image URL or local path) -->
    <h2>Sample Image</h2>
    <img src="https://placeholder.com" alt="A simple placeholder image" width="150" height="150">

</body>
</html>
